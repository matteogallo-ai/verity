[project]
name = "verity"
version = "1.0.1"
description = "Evaluated, observable RAG agent platform for enterprise documents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Matteo Gallo" }]
keywords = ["rag", "evaluation", "observability", "llm", "agent", "retrieval"]

dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "rich>=13.9",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "httpx>=0.27",
  # Pinned to the 1.x line: 1.x removed ``temperature`` from the typed
  # ``messages.create`` signature — we pass it via ``extra_body`` in
  # ``verity.llm.clients.AnthropicClient``. Pin ``<2.0`` because a major
  # bump would need re-validating that path (and the SDK-schema smoke test
  # in ``tests/unit/test_llm_sdk_schema.py`` will catch a silent break).
  "anthropic>=1.0,<2.0",
  # Pinned to the 3.x line: matches the ``chat.completions.create`` signature
  # asserted by the SDK-schema smoke test.
  "openai>=3.0,<4.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",  # imported by retrieval.memory_store
  "sentence-transformers>=3.2",
  "docling>=2.0",
  "trafilatura>=2.0",
  # Not imported directly: declared so [tool.uv.sources] can route them to the
  # CPU-only PyTorch index (uv sources apply to direct dependencies only).
  # sentence-transformers and docling pull them in transitively.
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.scripts]
verity = "verity.cli:app"

[project.urls]
Homepage = "https://github.com/matteogallo-ai/verity"
Repository = "https://github.com/matteogallo-ai/verity"

[project.optional-dependencies]
# OTLP trace export to a collector (VERITY_OTEL_ENDPOINT). Optional: it pulls in
# protobuf and an HTTP stack the local demo does not need.
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "vulture>=2.16",
  "deptry>=0.25.1",
  "pytest-socket>=0.8.1",
  "pyyaml>=6",
  "types-pyyaml>=6",
  "hypothesis>=6.170.14",
  "mutmut>=3.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "RUF", "ASYNC"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["verity"]

[tool.vulture]
paths = ["src"]
min_confidence = 60
# Called by a framework, not by our code: Typer commands, FastAPI routes, pydantic validators.
ignore_decorators = ["@app.*", "@router.*", "@*_app.command", "@model_validator"]
ignore_names = [
  # pydantic / pydantic-settings fields read by the framework or serialized to JSON.
  "model_config", "cited", "version", "reference_answer", "tags", "answer_text",
  "refusal_rationale",
  # Parameters of Protocol method signatures that mirror third-party APIs
  # (sentence-transformers encode / predict).
  "sentences", "normalize_embeddings", "show_progress_bar", "convert_to_numpy",
  # psycopg connection attribute, set for its side effect.
  "autocommit",
  # Public protocol surface (verity.*.base), conformance checked in
  # tests/unit/test_protocols.py; implementations must keep these members.
  "RetrievalMetric", "evaluate", "latest", "dim", "get_chunks", "count_chunks",
  # OpenTelemetry SpanExporter interface, called by the span processor.
  "export",
  # Tracer state asserted by tests/unit/test_tracer.py (OTLP active or not).
  "otlp_enabled",
]

[tool.deptry.per_rule_ignores]
# python-multipart: imported by FastAPI at runtime for UploadFile / Form parsing.
# torch, torchvision: declared only to route them to the CPU index (see
#   [tool.uv.sources]); imported by sentence-transformers and docling.
# opentelemetry-exporter-otlp-proto-http: the otlp extra, imported lazily by
#   verity.observability.tracer; deptry maps modules by their top-level package
#   (opentelemetry), which the core SDK dependency already claims.
DEP002 = ["python-multipart", "torch", "torchvision", "opentelemetry-exporter-otlp-proto-http"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["verity"]

[[tool.mypy.overrides]]
module = [
  "rank_bm25.*",
  "sentence_transformers.*",
  "docling.*",
  "trafilatura.*",
  "opentelemetry.exporter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=verity --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
markers = [
  "integration: requires external services (postgres, network)",
  "slow: loads the local embedding / reranker models; excluded from the fast lane",
]

# Mutation testing (`make mutation`, report in docs/quality/mutation.md). Only the
# modules that decide what ships are mutated: the citation verbatim check, the support
# checks, the model-output parser, the refusal and retrieval metrics, the headline
# aggregation and rank fusion. Mutants run against the fast lane only.
[tool.mutmut]
source_paths = ["src/verity"]
# A worker forked from the process that already ran the suite inherits its threads and
# native state (torch, anyio portals) and dies with SIGSEGV on macOS on unmutated
# code; a dedicated fork server keeps workers clean. The Objective-C runtime still
# aborts forked children unless OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES (set by
# `make mutation`).
process_isolation = "forkserver"
only_mutate = [
  "src/verity/agent/synthesizer.py",
  "src/verity/agent/support.py",
  "src/verity/llm/json_output.py",
  "src/verity/eval/refusal.py",
  "src/verity/eval/retrieval_metric.py",
  "src/verity/eval/headline.py",
  "src/verity/retrieval/fusion.py",
]
# Files and directories the fast lane reads from the checkout.
also_copy = [
  "prompts", "migrations", "datasets", "scorecards", "scripts", "docs", "README.md",
  "Dockerfile", "docker-compose.yml", "web/tests",
]
# Left out: the three files that assert on structlog.testing.capture_logs. mutmut calls
# pytest several times in one process, and loggers cached on first use by an earlier
# call bypass the capture, so they fail on unmutated code. None of them targets a
# mutated module.
pytest_add_cli_args = [
  "-m", "not integration and not slow", "-p", "no:cacheprovider", "--no-cov",
  "--ignore=tests/unit/test_request_log.py",
  "--ignore=tests/unit/test_tracer.py",
  "--ignore=tests/unit/test_chunker.py",
]

[tool.coverage.run]
branch = true
source = ["src/verity"]

# CPU-only PyTorch on Linux and Windows. The default PyPI torch wheel for Linux
# pulls ~15 nvidia-* CUDA packages (several GB) that a CPU inference workload never
# uses. macOS wheels on PyPI carry no CUDA, so macOS keeps the default index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
# 1.27 is the first hatchling that reads `license` as an SPDX expression (PEP 639).
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]

# Prompts and SQL migrations are read at run time; the wheel carries them so an
# installed package does not depend on a checkout (see verity.resources).
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "verity/_resources/prompts"
"migrations" = "verity/_resources/migrations"
