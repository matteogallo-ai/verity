[project]
name = "verity"
version = "0.2.0"
description = "Evaluated, observable RAG agent platform for enterprise documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matteo Gallo" }]
keywords = ["rag", "evaluation", "observability", "llm", "agent", "retrieval"]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "rich>=13.9",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "httpx>=0.27",
  "anthropic>=0.39",
  "openai>=1.54",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.2",
  "docling>=2.0",
  "trafilatura>=2.0",
]

[project.scripts]
verity = "verity.cli:app"

[project.urls]
Homepage = "https://github.com/matteogallo-ai/verity"
Repository = "https://github.com/matteogallo-ai/verity"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "RUF", "ASYNC"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["verity"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["verity"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "sentence_transformers.*", "docling.*", "pgvector.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=verity --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
markers = [
  "integration: requires external services (postgres, network)",
  "eval: part of the evaluation harness, slower",
]

[tool.coverage.run]
branch = true
source = ["src/verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]
