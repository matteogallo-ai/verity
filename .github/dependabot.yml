# Weekly, grouped version updates: one PR per ecosystem per week for minor and
# patch bumps, so they are reviewed and tested together. Major bumps stay out of
# the groups and get one PR each, because they break on their own (next 16 drops
# `next lint`, vite 7 is outside @vitejs/plugin-react 4's peer range).
version: 2
updates:
  # pyproject.toml + uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Next.js UI; the npm ecosystem reads web/pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Actions are pinned by SHA; Dependabot updates the SHA and the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images of the Dockerfile and docker-compose.yml are pinned by digest; these
  # propose the new digest when the tag moves.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
