name: Scorecard

# Scorecard publishes results only from the default branch, so this workflow does
# not run on pull requests.
on:
  push:
    branches: [main]
  # Branch-Protection is one of the checks: a rule change re-scores it.
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the SARIF to the repository's code-scanning alerts.
      security-events: write
      # publish_results: the OIDC token proves to api.scorecard.dev which
      # repository and workflow produced the results behind the README badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
