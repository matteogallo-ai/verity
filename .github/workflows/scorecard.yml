name: Scorecard

# Scorecard publishes results only from the default branch, so this workflow does
# not run on pull requests.
on:
  push:
    branches: [main]
  # Branch-Protection is one of the checks: a rule change re-scores it.
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the SARIF to the repository's code-scanning alerts.
      security-events: write
      # publish_results: the OIDC token proves to api.scorecard.dev which
      # repository and workflow produced the results behind the README badge.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
