name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repository: read is enough for every one of them.
permissions:
  contents: read

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (with dev group)
        run: uv sync --dev

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Vulture (dead code)
        run: uv run vulture

      - name: Deptry (unused / missing / transitive dependencies)
        run: uv run deptry src

      - name: Results table and README key result match the committed scorecard
        run: uv run python scripts/generate_headline_results.py --check

      - name: Judge-validation blocks of docs/results.md match their artefact
        run: uv run python scripts/render_judge_validation.py --check

      - name: Naive-baseline comparison matches its artefacts
        run: uv run python scripts/compare_naive_baseline.py --check

      - name: Two-arm comparison matches its four pinned artefacts
        run: uv run python scripts/compare_two_arm.py --check

      - name: Refusal by tag, correctness and the kappa interval match their artefacts
        run: |
          uv run python scripts/refusal_by_tag.py --check
          uv run python scripts/judge_correctness.py render --check
          uv run python scripts/judge_agreement.py kappa-ci --check

      - name: PDF and DOCX corpus documents match their Markdown sources
        run: uv run python scripts/build_corpus_documents.py --check

      - name: Dev/test split matches the seeded split
        run: uv run python scripts/split_dataset.py --check

      - name: Recomputed aggregates of the live runs are current
        run: uv run python scripts/recompute_live_aggregates.py --check

      - name: Refusal analysis is what the live dev and test runs give
        run: >-
          uv run python scripts/refusal_analysis.py --check
          --dev datasets/eval/runs/live/eval_6ec544d_dev.json
          --test datasets/eval/runs/live/eval_969e1d5_test.json
          --out-json scorecards/refusal-analysis.json

      - name: Pytest — fast lane (no models, no network, must stay < 60 s)
        # tests/conftest.py disables inet sockets for this lane; HF_HUB_OFFLINE makes
        # a hidden model download fail fast instead of retrying.
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run pytest -m "not integration and not slow"

      - name: Pytest — slow lane (loads the local embedding / reranker models)
        # The runner log shows a line only at a newline: -v prints one per test, and a
        # test stuck past faulthandler_timeout dumps every thread's stack, so a hang
        # names itself instead of running silently until the job is cancelled.
        timeout-minutes: 40
        run: >-
          uv run pytest -m "slow and not integration" --cov-append -v
          -o faulthandler_timeout=900

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  stale-narrative:
    name: stale narrative (rule 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: No sprint labels, future promises or untracked TODOs
        run: python scripts/check_stale_narrative.py

  commits:
    name: conventional commits (rule 8)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Every commit subject in the PR is a Conventional Commit
        run: |
          python scripts/check_commit_messages.py \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  claims:
    name: claims (rule 1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: verity
          POSTGRES_DB: verity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verity -d verity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VERITY_DATABASE_URL: postgresql://verity:verity@localhost:5432/verity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (with dev group)
        run: uv sync --dev

      - name: Apply migrations
        run: uv run verity db upgrade

      - name: Every shipped claim's tests pass; docs/features.md matches docs/CLAIMS.md
        run: uv run python scripts/check_claims.py

  integration:
    name: integration (pgvector round-trip)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: verity
          POSTGRES_DB: verity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verity -d verity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VERITY_DATABASE_URL: postgresql://verity:verity@localhost:5432/verity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (with dev group)
        run: uv sync --dev

      - name: Apply migrations
        run: uv run verity db upgrade

      - name: Pytest (integration lane)
        run: uv run pytest -m integration

      - name: Retrieval scorecard (pgvector) — anti-regression gate
        # We gate on nDCG@k rather than precision@k because the labeled gold set is
        # small (1-2 relevant chunks per question) — a precision floor at k=8 caps at
        # 0.25 by construction regardless of retrieval quality. nDCG at 0.5 catches a
        # real regression (baseline on this corpus is ≈ 0.88). Recall floor at 0.75
        # is the "did we lose the gold chunk entirely" gate. Raise these floors as
        # the labeled corpus grows.
        run: |
          uv run verity eval retrieval \
            --store pgvector \
            --floor-ndcg 0.5 \
            --floor-recall 0.75

  evaluation:
    name: eval pipeline smoke test (stub agent + stub judge)
    runs-on: ubuntu-latest
    # Runs the eval pipeline end to end with local embeddings, the scripted stub agent
    # and the stub judge, no API keys. Its numbers are not quality measures; the
    # published scorecard comes from a live run (see docs/evaluation-methodology.md).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --dev

      - name: Pipeline smoke test (stub agent, stub judge; not a quality measure)
        # This job has no Postgres service: the in-memory store keeps it self-contained.
        env:
          VERITY_STORE: memory
        # Retrieval metrics come from the real local embedder and reranker, so only
        # they are gated. Refusal metrics describe the scripted stub agent's keyword
        # matching and answer-quality metrics the stub judge: no floor on either.
        # The command is the README quickstart's (tests/unit/test_repo_rules.py), floors added.
        run: |
          uv run verity eval run \
            --ci \
            --floor-ndcg 0.5 \
            --floor-recall 0.75

  docker:
    name: docker (image build + compose stack smoke test)
    runs-on: ubuntu-latest
    # Builds the image, brings up db → migrate → ingest → app with Compose and checks
    # /health, a non-empty /status corpus, 401 without a key and one stub /ask.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose smoke test
        run: scripts/docker_smoke.sh

  web:
    name: web (Next.js UI · Node 22 · pnpm@9)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable corepack + pin pnpm from packageManager
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (tsc --noEmit strict)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (next build)
        run: pnpm build

  osv-scanner:
    name: osv-scanner (known vulnerabilities in uv.lock and web/pnpm-lock.yaml)
    runs-on: ubuntu-latest
    # Dependabot proposes updates on its weekly schedule; this job fails the PR that
    # resolves a package with a known vulnerability (OSV database) today. Accepted
    # exceptions, each with its reason and expiry date, live in osv-scanner.toml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No known vulnerability in the lockfiles
        # The image the osv-scanner-action runs, by digest: the action itself
        # references it by the mutable tag v2.7.0, which a commit pin does not freeze.
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 # v2.7.0
        with:
          args: --config=./osv-scanner.toml --lockfile=./uv.lock --lockfile=./web/pnpm-lock.yaml
