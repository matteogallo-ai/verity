name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (with dev group)
        run: uv sync --dev

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest (unit + coverage)
        run: uv run pytest -m "not integration"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: integration (pgvector round-trip)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: verity
          POSTGRES_DB: verity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verity -d verity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VERITY_DATABASE_URL: postgresql://verity:verity@localhost:5432/verity
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (with dev group)
        run: uv sync --dev

      - name: Apply migrations
        run: uv run verity db upgrade

      - name: Pytest (integration lane)
        run: uv run pytest -m integration

      - name: Retrieval scorecard (pgvector) — anti-regression gate
        # We gate on nDCG@k rather than precision@k because the labeled gold set is
        # small (1-2 relevant chunks per question) — a precision floor at k=8 caps at
        # 0.25 by construction regardless of retrieval quality. nDCG at 0.5 catches a
        # real regression (baseline on this corpus is ≈ 0.88). Recall floor at 0.75
        # is the "did we lose the gold chunk entirely" gate. Raise these floors as
        # the labeled corpus grows.
        run: |
          uv run verity eval retrieval \
            --no-in-memory \
            --floor-ndcg 0.5 \
            --floor-recall 0.75

  evaluation:
    name: eval harness (deterministic)
    runs-on: ubuntu-latest
    # Runs the eval suite in CI mode: local embeddings + stubbed judge, no API keys.
    # Real headline scorecard is produced out-of-band from a full run (see docs/evaluation-methodology.md).
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --dev

      - name: Run eval (deterministic — judge=stub)
        # Retrieval + refusal + latency + cost are REAL numbers.
        # faithfulness / citation_accuracy / hallucination_rate come from the
        # mechanical stub judge and are labelled "stub-judge-v1" in the artefact —
        # they are never presented as real LLM-judge chiffres.
        # Floors are the S3-established anti-regression gates.
        run: |
          uv run verity eval run \
            --judge stub \
            --dataset datasets/eval/questions.jsonl \
            --floor-refusal-recall 0.8 \
            --floor-ndcg 0.5 \
            --floor-recall 0.75

  web:
    name: web (Next.js UI · Node 22 · pnpm@9)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack + pin pnpm from packageManager
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (tsc --noEmit strict)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (next build)
        run: pnpm build
